<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plumbline Social Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      display: flex;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .left-col {
      width: 680px;
      padding: 72px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      font-size: 36px;
      color: #059669;
      font-weight: 700;
    }
    .brand-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #0f172a;
    }
    .title-group {
      margin-top: 24px;
    }
    .tagline {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #0f172a;
      margin-bottom: 20px;
    }
    .subtext {
      font-size: 20px;
      line-height: 1.5;
      color: #64748b;
    }
    .badge-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 36px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }
    .badge.highlight {
      background: rgba(5, 150, 105, 0.1);
      border-color: #059669;
      color: #059669;
    }
    .right-col {
      width: 520px;
      background: #f8fafc;
      border-left: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }
    .graph-card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .graph-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .verdict-pill {
      background: #059669;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .svg-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="left-col">
    <div>
      <div class="brand">
        <span class="brand-mark">⌖</span>
        <span class="brand-name">Plumbline</span>
      </div>
      <div class="title-group">
        <h1 class="tagline">Refactor old code without changing what it does.</h1>
        <p class="subtext">
          Pins behavior with isolated tests, plants AST tripwires, and verifies refactor fidelity on the Plumb Graph.
        </p>
      </div>
    </div>

    <div class="badge-row">
      <div class="badge highlight">Verdict: HOLDS TRUE</div>
      <div class="badge">NVIDIA Nemotron 3</div>
      <div class="badge">Token Factory Sandboxes</div>
    </div>
  </div>

  <div class="right-col">
    <div class="graph-card">
      <div class="graph-header">
        <span class="graph-title">The Plumb Graph</span>
        <span class="verdict-pill">HOLDS TRUE</span>
      </div>
      <div class="svg-container">
        <svg viewBox="0 0 400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Top Anchor -->
          <circle cx="200" cy="20" r="6" fill="#0f172a" />
          <path d="M190 20 H210" stroke="#0f172a" stroke-width="2" />

          <!-- Vertical Plumb Line (True) -->
          <line x1="200" y1="20" x2="200" y2="380" stroke="#059669" stroke-width="2.5" />

          <!-- Checkpoint Stage 2 -->
          <circle cx="200" cy="90" r="5" fill="#ffffff" stroke="#059669" stroke-width="2" />
          <text x="215" y="94" font-size="11" font-weight="600" fill="#334155" font-family="monospace">14 pins locked</text>

          <!-- Checkpoint Stage 3 / Tick Strip -->
          <circle cx="200" cy="170" r="5" fill="#ffffff" stroke="#059669" stroke-width="2" />
          <text x="215" y="174" font-size="11" font-weight="600" fill="#334155" font-family="monospace">18/20 mutants caught (90%)</text>
          
          <!-- Tick Strip visualization -->
          <rect x="120" y="186" width="160" height="8" rx="2" fill="#e2e8f0" />
          <rect x="120" y="186" width="144" height="8" rx="2" fill="#059669" />

          <!-- Stage 4 Bifurcation -->
          <circle cx="200" cy="240" r="5" fill="#059669" />
          
          <!-- Candidate B (Divergent Cable) -->
          <path d="M200 240 Q250 280 290 350" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" />
          <circle cx="290" cy="350" r="7" fill="#dc2626" />
          <text x="302" y="348" font-size="10" font-weight="600" fill="#dc2626">Cand. B (Balanced)</text>
          <text x="302" y="360" font-size="9" fill="#dc2626">Penny rounding drift</text>

          <!-- Candidate A (Settled Bob on True Line) -->
          <circle cx="200" cy="380" r="10" fill="#059669" />
          <circle cx="200" cy="380" r="4" fill="#ffffff" />
          <text x="218" y="384" font-size="12" font-weight="700" fill="#059669">Candidate A: 0 drift</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
